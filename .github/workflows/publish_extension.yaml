name: Tagged Production Deploys for VS Code

on:
  workflow_dispatch:
  push:
    tags:
      - "mlogls-vscode-*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Package vsix
        run: pnpm dlx @vscode/vsce package -o extension.vsix
        working-directory: packages/mlogls-vscode
      - name: Upload mlogls-vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: mlogls-vsix
          path: packages/mlogls-vscode/extension.vsix

  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - uses: actions/download-artifact@v8
        with:
          name: mlogls-vsix
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath extension.vsix --oidc --skip-duplicate

  publish-open-vsx:
    name: Publish to Open VSX
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: open-vsx
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - uses: actions/download-artifact@v8
        with:
          name: mlogls-vsix
      - name: Publish to Open VSX
        run: npx ovsx publish extension.vsix --trusted-publishing --skip-duplicate
