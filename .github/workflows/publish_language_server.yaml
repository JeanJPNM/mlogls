name: Tagged Production Deploys for the Language Server

on:
  workflow_dispatch:
  push:
    tags:
      - "mlogls-*"
      - "!mlogls-vscode-*"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment:
      name: language-server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - run: npm install -g npm@11
      - run: pnpm -C packages/mlogls build
      - run: npm publish
        working-directory: packages/mlogls
